<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Japan Haul">
<meta name="theme-color" content="#14161c">
<link rel="apple-touch-icon" href="icon.png">
<title>Japan Haul</title>
<style>
:root{--bg:#14161c;--card:#1e212a;--card2:#272b36;--line:#343947;--text:#eef0f4;--mut:#9aa1b1;--acc:#e3473b;--acc2:#ffcb3d;--ok:#3ccf7a;--warn:#ffb020;--bad:#ff5a5a;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
body{padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 84px)}
h1{font-size:22px;margin:4px 0 2px}
h2{font-size:17px;margin:0 0 10px}
.mut{color:var(--mut);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.rate{font-size:13px;color:var(--mut);text-align:right}
.rate b{color:var(--acc2)}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
label:first-child{margin-top:0}
input,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit}
input:focus,select:focus{outline:2px solid var(--acc2);border-color:transparent}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1;min-width:0}
.row>.shrink{flex:0 0 auto}
button{font:inherit;cursor:pointer}
.btn{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-weight:600;font-size:15px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.full{width:100%;margin-top:12px;padding:14px}
.btn.danger{color:var(--bad)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:11px 8px;font-weight:600}
.seg button.on{background:var(--acc2);color:#111}
.hidden{display:none!important}
.photo{width:100%;border-radius:12px;background:#000;display:block;max-height:420px;object-fit:contain}
.photoBtn{width:100%;border:2px dashed var(--line);border-radius:12px;background:var(--bg);color:var(--mut);padding:28px 10px;font-size:15px;font-weight:600}
.photoBtn span{display:block;font-size:30px;margin-bottom:4px}
.info{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.info img{width:92px;border-radius:8px;flex:0 0 auto;background:#000}
.info .name{font-size:18px;font-weight:700}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pbox{background:var(--bg);border-radius:10px;padding:10px}
.pbox .v{font-size:20px;font-weight:700}
.pbox .l{font-size:12px;color:var(--mut)}
.cmbtn{display:block;text-align:center;margin-top:10px;background:var(--acc2);color:#111;font-weight:700;text-decoration:none;border-radius:10px;padding:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:13px;color:var(--text)}
.sugg{margin-top:6px;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:340px;overflow-y:auto}
.sug{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:11px 12px;border:0;border-bottom:1px solid var(--line);background:var(--bg);color:var(--text);text-align:left;font-size:15px}
.sug:last-child{border-bottom:0}
.sug .c{font-size:12px;color:var(--mut)}
.sug b{white-space:nowrap;color:var(--acc2);font-size:14px}
.warn{color:var(--warn);font-size:14px;margin-top:8px}
.deal{margin-top:12px;border-radius:10px;padding:12px;font-weight:700;text-align:center;font-size:17px}
.deal small{display:block;font-weight:500;font-size:13px;opacity:.85;margin-top:2px}
.d-great{background:rgba(60,207,122,.18);color:var(--ok)}
.d-good{background:rgba(60,207,122,.10);color:var(--ok)}
.d-fair{background:rgba(255,176,32,.14);color:var(--warn)}
.d-bad{background:rgba(255,90,90,.15);color:var(--bad)}
.d-none{background:var(--card2);color:var(--mut)}
.linkbtn{background:none;border:0;color:var(--acc2);font-size:13px;padding:6px 0;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin:8px 0;color:var(--text)}
.item img,.item .ph{width:58px;height:78px;object-fit:cover;border-radius:8px;background:var(--card2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:24px}
.item .body{flex:1;min-width:0}
.item .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--mut)}
.item .p{font-size:14px;margin-top:3px}
.item .arr{color:var(--mut);font-size:20px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;margin-left:4px}
.formhead{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(20,22,28,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:6px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button.on{color:var(--acc2)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.busy{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:14px;margin-top:10px}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--acc2);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="top">
  <div><h1>Japan Haul</h1><div class="mut">Japanische Pokémon-Käufe</div></div>
  <div class="rate" id="rateBox">Kurs wird geladen …</div>
</div>

<!-- ============ ERFASSEN / DETAIL ============ -->
<section id="tabAdd">
  <div class="formhead">
    <h2 id="formTitle" style="margin:0">Neuer Eintrag</h2>
    <button class="linkbtn hidden" id="btnNew">+ Neuer Eintrag</button>
  </div>

  <div class="box">
    <label>Sprache</label>
    <select id="fLang">
      <option value="ja">Japanisch</option><option value="de">Deutsch</option><option value="en">Englisch</option>
      <option value="ko">Koreanisch</option><option value="zh-cn">Chinesisch (vereinfacht)</option><option value="zh-tw">Chinesisch (traditionell)</option>
    </select>
    <label>Typ</label>
    <div class="seg" id="segType">
      <button data-v="Karte" class="on">Karte</button>
      <button data-v="Graded">Graded</button>
      <button data-v="Sealed">Sealed</button>
    </div>
  </div>

  <!-- Foto -->
  <div class="box">
    <button class="photoBtn" id="btnPhoto"><span>📷</span>Foto aufnehmen</button>
    <img class="photo hidden" id="photo" alt="">
    <button class="linkbtn hidden" id="btnPhotoAgain">Foto ersetzen</button>
    <input type="file" id="inPhoto" accept="image/*" class="hidden">
  </div>

  <!-- Karte suchen -->
  <div class="box" id="pCard">
    <label>Kartencode (unten links auf der Karte)</label>
    <div class="row">
      <div><input id="fCode" placeholder="z. B. M5 092/081 oder PAF 012/091" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"></div>
      <div class="shrink"><button class="btn pri" id="btnLookup">Suchen</button></div>
    </div>
    <div class="chips" id="setCands"></div>
    <div class="busy hidden" id="lookBusy"><div class="spin"></div><span>Suche auf Cardmarket-Daten …</span></div>
    <div id="cardInfo"></div>
  </div>

  <!-- Sealed suchen -->
  <div class="box hidden" id="pSealed">
    <label>Produkt suchen <span id="cmInfo"></span></label>
    <input id="fSealedQ" placeholder="z. B. Inferno" autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="sugg hidden" id="sugg"></div>
    <div id="sealedInfo"></div>
  </div>

  <!-- Zustand -->
  <div class="box">
    <div id="condRow">
      <label>Zustand</label>
      <select id="fCond"><option value="MT">Mint (MT)</option><option value="NM" selected>Near Mint (NM)</option><option value="EX">Excellent (EX)</option><option value="GD">Good (GD)</option><option value="LP">Light Played (LP)</option><option value="PL">Played (PL)</option><option value="PO">Poor (PO)</option></select>
    </div>
    <div class="row hidden" id="gradeRow">
      <div><label>Grading-Firma</label><select id="fGrader"><option>PSA</option><option>BGS</option><option>CGC</option><option>ARS</option><option>Andere</option></select></div>
      <div><label>Note</label><input id="fGrade" inputmode="decimal" placeholder="10"></div>
    </div>
    <div id="sealedCondRow" class="hidden"><label>Zustand</label><select id="fSealedCond"><option>Versiegelt</option><option>Geöffnet</option><option>Folie beschädigt</option></select></div>
  </div>

  <!-- Preise -->
  <div class="box">
    <label>Cardmarket-Preis (€, selbst eintragen)</label>
    <input id="fMarket" inputmode="decimal" placeholder="Preis von Cardmarket">
    <button class="linkbtn hidden" id="btnTakeLow"></button>
    <label>Preis vor Ort</label>
    <div class="row">
      <div><input id="fPrice" inputmode="decimal" placeholder="0"></div>
      <div class="shrink"><div class="seg" id="segCur"><button data-v="JPY" class="on">¥</button><button data-v="EUR">€</button></div></div>
    </div>
    <div class="mut" id="priceConv" style="margin-top:4px"></div>
    <div class="row">
      <div><label>Kaufdatum</label><input type="date" id="fDate"></div>
      <div class="shrink" style="width:90px"><label>Menge</label><input id="fQty" inputmode="numeric" value="1"></div>
    </div>
    <div class="deal d-none" id="dealBox">Preise eintragen für Deal-Check</div>
    <label>Kaufort</label>
    <input id="fPlace" list="placeList" placeholder="z. B. Tokio Akihabara, Kartenmesse Dortmund" autocomplete="off">
    <datalist id="placeList"></datalist>
    <label>Notiz</label>
    <input id="fNote" placeholder="optional">
    <button class="btn pri full" id="btnSave">Speichern</button>
    <button class="btn full danger hidden" id="btnDelete">Eintrag löschen</button>
  </div>
</section>

<!-- ============ LISTE ============ -->
<section id="tabList" class="hidden">
  <div class="stats" style="margin-top:14px">
    <div class="pbox"><div class="l">Ausgegeben</div><div class="v" id="sSpentY">¥0</div><div class="l" id="sSpentE">0 €</div></div>
    <div class="pbox"><div class="l">Wert lt. Cardmarket</div><div class="v" id="sMarket">0 €</div><div class="l" id="sDiff"></div></div>
  </div>
  <div class="row" style="margin-top:10px">
    <div><input id="fSearch" placeholder="Suchen …"></div>
    <div class="shrink"><button class="btn" id="btnExport">⬇︎ Excel</button></div>
  </div>
  <div id="list"></div>
</section>

<!-- ============ EINSTELLUNGEN ============ -->
<section id="tabSet" class="hidden">
  <div class="box">
    <h2>Wechselkurs</h2>
    <div class="mut" id="rateInfo"></div>
    <label>Eigener Kurs (1 € = x ¥), leer = automatisch</label>
    <div class="row"><div><input id="fRateOv" inputmode="decimal" placeholder="automatisch"></div><div class="shrink"><button class="btn" id="btnRateSave">Übernehmen</button></div></div>
  </div>
  <div class="box">
    <h2>Sealed-Produktliste</h2>
    <div class="mut" id="cmStatus">Noch nicht geladen.</div>
    <button class="btn full" id="btnCmReload">Liste neu laden</button>
  </div>
  <div class="box">
    <h2>Export &amp; Backup</h2>
    <button class="btn full" id="btnExport2">Excel-Datei (.xlsx)</button>
    <button class="btn full" id="btnCsv">CSV (für Excel)</button>
    <button class="btn full" id="btnBackup">Backup mit Fotos (.json)</button>
    <button class="btn full" id="btnRestore">Backup einspielen</button>
    <input type="file" id="inRestore" accept="application/json,.json" class="hidden">
    <p class="mut">Alle Daten und Fotos liegen nur auf diesem iPhone.</p>
  </div>
</section>

<nav>
  <button data-tab="tabAdd" class="on"><span>＋</span>Erfassen</button>
  <button data-tab="tabList"><span>☰</span>Liste</button>
  <button data-tab="tabSet"><span>⚙︎</span>Einstellungen</button>
</nav>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('Speicher voll – bitte Backup machen'); return false; } }
};
const API = () => 'https://api.tcgdex.net/v2/' + (($('#fLang') && $('#fLang').value) || 'ja');
const LANG_LBL = { ja: 'JP', de: 'DE', en: 'EN', ko: 'KR', 'zh-cn': 'CN', 'zh-tw': 'TW' };
const WESTERN = l => l === 'de' || l === 'en';
// Aufgedrucktes Set-Kürzel westlicher Karten → Datenbank-ID
const ABBR = Object.fromEntries('BS:base1,JU:base2,FO:base3,B2:base4,RO:base5,G1:gym1,G2:gym2,N1:neo1,N2:neo2,SI:si1,N3:neo3,N4:neo4,LC:lc,EX:ecard1,AQ:ecard2,SK:ecard3,RS:ex1,SS:ex2,DR:ex3,MA:ex4,HL:ex5,RG:ex6,P1:pop1,TR:ex7,DX:ex8,EM:ex9,P2:pop2,UF:ex10,DS:ex11,LM:ex12,P3:pop3,HP:ex13,P4:pop4,CG:ex14,DF:ex15,PK:ex16,P5:pop5,DP:dp1,MT:dp2,P6:pop6,SW:dp3,GE:dp4,P7:pop7,MD:dp5,LA:dp6,P8:pop8,SF:dp7,PL:pl1,P9:pop9,RR:pl2,SV:pl3,AR:pl4,RM:ru1,HS:hgss1,UL:hgss2,UND:hgss3,TRI:hgss4,COL:col1,BLW:bw1,BWP:bwp,EP:bw2,NVI:bw3,NXD:bw4,DEX:bw5,DRX:bw6,DRV:dv1,BCR:bw7,PLS:bw8,PLF:bw9,PLB:bw10,XYP:xyp,LTR:bw11,KSS:xy0,XY:xy1,FLF:xy2,FFI:xy3,PHF:xy4,PRC:xy5,DCR:dc1,ROS:xy6,AOR:xy7,BKT:xy8,BKP:xy9,GEN:g1,FCO:xy10,STS:xy11,EVO:xy12,SMP:smp,SUM:sm1,GRI:sm2,BUS:sm3,SLG:sm3.5,CIN:sm4,UPR:sm5,FLI:sm6,CES:sm7,DRM:sm7.5,LOT:sm8,TEU:sm9,DET:det1,UNB:sm10,UNM:sm11,HIF:sm115,CEC:sm12,SSH:swsh1,RCL:swsh2,DAA:swsh3,CPA:swsh3.5,VIV:swsh4,SHF:swsh4.5,BST:swsh5,CRE:swsh6,EVS:swsh7,CEL:cel25,FST:swsh8,BRS:swsh9,ASR:swsh10,PGO:swsh10.5,LOR:swsh11,SIT:swsh12,CRZ:swsh12.5,SVI:sv01,SVE:sve,SVP:svp,PAL:sv02,OBF:sv03,MEW:sv03.5,MFB:mfb,PAR:sv04,PAF:sv04.5,TEF:sv05,TWM:sv06,SFA:sv06.5,SCR:sv07,SSP:sv08,PRE:sv08.5,JTG:sv09,DRI:sv10,WHT:sv10.5w,BLK:sv10.5b,MEE:mee,MEP:mep,MEG:me01,PFL:me02,ASC:me02.5,POR:me03,CRI:me04,PBL:me05,30C:30th'.split(',').map(p => p.split(':')));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { if (v === null || v === undefined || v === '') return null; const n = parseFloat(String(v).replace(/\s/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); return isNaN(n) ? null : n; };
const fY = n => '¥' + Math.round(n).toLocaleString('de-DE');
const fE = n => n.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
const fNumIn = n => n == null ? '' : String(Math.round(n * 100) / 100).replace('.', ',');
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fDate = d => String(d || '').slice(0, 10).split('-').reverse().join('.');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
const scripts = {};
function loadScript(src) {
  if (!scripts[src]) scripts[src] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { delete scripts[src]; rej(new Error('Laden fehlgeschlagen')); }; document.head.appendChild(s); });
  return scripts[src];
}
async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }

/* ---------- IndexedDB (Fotos, Sealed-Liste) ---------- */
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('japanhaul', 2);
    r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbGet(store, k) { try { const db = await idbOpen(); return await new Promise(res => { const q = db.transaction(store).objectStore(store).get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; } }
async function idbSet(store, k, v) { try { const db = await idbOpen(); await new Promise(res => { const t = db.transaction(store, 'readwrite'); t.objectStore(store).put(v, k); t.oncomplete = res; t.onerror = res; }); return true; } catch (e) { return false; } }
async function idbDel(store, k) { try { const db = await idbOpen(); db.transaction(store, 'readwrite').objectStore(store).delete(k); } catch (e) {} }

/* ---------- Zustand ---------- */
let items = LS.get('jh_items', []);
let settings = Object.assign({ rateOverride: null, lang: 'ja', place: '' }, LS.get('jh_settings', {}));
let rate = LS.get('jh_rate', null);
const setsCaches = {};
const curLang = () => $('#fLang').value || 'ja';
let F = null;        // aktuelles Formular
let editId = null;
let curCurrency = 'JPY';
const saveItems = () => LS.set('jh_items', items);

/* ---------- Wechselkurs ---------- */
const R = () => settings.rateOverride || (rate && rate.v) || 160;
async function loadRate() {
  const srcs = [
    ['https://api.frankfurter.dev/v1/latest?base=EUR&symbols=JPY', j => j.rates.JPY],
    ['https://api.frankfurter.app/latest?from=EUR&to=JPY', j => j.rates.JPY],
    ['https://open.er-api.com/v6/latest/EUR', j => j.rates.JPY]
  ];
  for (const [u, f] of srcs) { try { const v = f(await getJSON(u)); if (v) { rate = { v, date: today() }; LS.set('jh_rate', rate); break; } } catch (e) {} }
  renderRate();
}
function renderRate() {
  const src = settings.rateOverride ? 'eigener Kurs' : (rate ? 'Stand ' + fDate(rate.date) : 'Standardwert, offline');
  $('#rateBox').innerHTML = `1 € = <b>${R().toLocaleString('de-DE', { maximumFractionDigits: 2 })} ¥</b><br>${src}`;
  $('#rateInfo').textContent = rate ? `Automatisch: 1 € = ${rate.v} ¥ (${fDate(rate.date)})` : 'Noch kein Kurs geladen.';
  $('#fRateOv').value = settings.rateOverride || '';
  updateDeal();
}

/* ---------- Cardmarket-Links ---------- */
function cmHref(id, query) {
  return id ? `https://www.cardmarket.com/de/Pokemon/Products?idProduct=${encodeURIComponent(id)}`
            : `https://www.cardmarket.com/de/Pokemon/Products/Search?searchString=${encodeURIComponent(query || '')}`;
}
const cmButton = (id, q) => (id || q) ? `<a class="cmbtn" href="${esc(cmHref(id, q))}" target="_blank" rel="noopener noreferrer">Auf Cardmarket öffnen ↗</a>` : '';
function priceBoxes(low, trend) {
  const r = R();
  if (!low && !trend) return `<p class="mut">Kein Cardmarket-Preis in den Daten – auf Cardmarket nachsehen.</p>`;
  return `<div class="prices">

/* ---------- Karten: Sets & Suche (TCGdex, japanisch) ---------- */
async function getSets(lang) {
  lang = lang || curLang();
  let c = setsCaches[lang] || LS.get('jh_sets_' + lang, null);
  if (c && Date.now() - c.t < 2 * 864e5) return (setsCaches[lang] = c).list;
  try {
    const list = await getJSON(`https://api.tcgdex.net/v2/${lang}/sets`);
    const rev = {}; Object.entries(ABBR).forEach(([a, id]) => rev[id] = a);
    c = { t: Date.now(), list: list.filter(s => !(WESTERN(lang) && /^(A\d|B\d|P-A)/.test(s.id)))
      .map(s => ({ id: s.id, name: s.name, official: s.cardCount && s.cardCount.official, abbr: WESTERN(lang) ? (rev[s.id] || '') : '' })) };
    LS.set('jh_sets_' + lang, c); setsCaches[lang] = c;
  } catch (e) { if (!c) throw e; setsCaches[lang] = c; }
  return c.list;
}
// Neue westliche Sets ohne bekanntes Kürzel: Kürzel nachladen
async function fillAbbr(lang, list) {
  const missing = list.filter(x => !x.abbr).slice(-12);
  await Promise.all(missing.map(async x => { try { const d = await getJSON(`https://api.tcgdex.net/v2/${lang}/sets/${encodeURIComponent(x.id)}`); x.abbr = (d.abbreviation && d.abbreviation.official) || '-'; } catch (e) {} }));
  if (setsCaches[lang]) LS.set('jh_sets_' + lang, setsCaches[lang]);
}
// "M5 092/081", "M5092-081", "sv2a 201", "001/M-P" → { set, num, den }
function parseCode(raw, list) {
  const s = String(raw || '').toLowerCase().replace(/[–—•·]/g, ' ').replace(/\b(en|de|fr|it|es|pt|jp)\b/g, ' ').replace(/\s+/g, ' ').trim();
  if (!s) return null;
  let m = s.replace(/\s/g, '').match(/^(\d{1,3})\/([a-z][a-z0-9-]*)$/);
  if (m) return { set: m[2], num: m[1], den: null };
  const flat = s.replace(/[\s_.]/g, '');
  let best = null;
  for (const x of (list || [])) for (const key of [x.abbr, x.id]) {
    const n = norm(key); if (!n || key === '-') continue;
    for (let i = 1; i <= flat.length; i++) {
      if (norm(flat.slice(0, i)) !== n) continue;
      const rm = flat.slice(i).match(/^-?(\d{1,3})(?:[\/-](\d{1,3}))?$/);
      if (!rm) continue;
      const score = n.length + (rm[2] && String(x.official) === String(parseInt(rm[2], 10)) ? 10 : 0);
      if (!best || score > best.score) best = { set: x.id, num: rm[1], den: rm[2] || null, score };
    }
  }
  if (best) return best;
  m = s.match(/^([a-z][a-z0-9-]*?)\s*-?\s*(\d{1,3})(?:\s*[\/-]\s*(\d{1,3}))?$/);
  if (m) return { set: m[1], num: m[2], den: m[3] || null };
  m = flat.match(/^(\d{1,3})(?:[\/-](\d{1,3}))?$/);
  if (m) return { set: '', num: m[1], den: m[2] || null };
  return null;
}
const setDetailCache = {};
async function loadCard(setId, n) {
  let lang = curLang(), key = lang + ':' + setId, via = null;
  if (!setDetailCache[key]) setDetailCache[key] = await getJSON(`https://api.tcgdex.net/v2/${lang}/sets/${encodeURIComponent(setId)}`);
  let s = setDetailCache[key];
  // Koreanisch/Chinesisch: Einzelkarten fehlen oft – dann Daten der japanischen Ausgabe (gleiche Set-ID) nutzen
  if (!(s.cards || []).length && lang !== 'ja' && !WESTERN(lang)) {
    try { const k2 = 'ja:' + setId; if (!setDetailCache[k2]) setDetailCache[k2] = await getJSON(`https://api.tcgdex.net/v2/ja/sets/${encodeURIComponent(setId)}`); if ((setDetailCache[k2].cards || []).length) { via = 'ja'; s = Object.assign({}, setDetailCache[k2], { name: setDetailCache[key].name || setDetailCache[k2].name, releaseDate: setDetailCache[key].releaseDate || setDetailCache[k2].releaseDate }); } } catch (e) {}
  }
  const cards = s.cards || [];
  if (!cards.length) throw new Error(`Für „${s.name || setId}“ sind in dieser Sprache keine Einzelkarten hinterlegt.`);
  const c = cards.find(c => parseInt(c.localId, 10) === parseInt(n, 10)) || cards.find(c => norm(c.localId) === norm(n));
  if (!c) throw new Error(`Nummer ${parseInt(n, 10)} gibt es in „${s.name || setId}“ nicht.`);
  const card = await getJSON(`https://api.tcgdex.net/v2/${via || lang}/cards/${encodeURIComponent(c.id)}`);
  return { set: s, card, via };
}
async function englishName(card) {
  try { const id = card.dexId && card.dexId[0]; if (!id) return null; const sp = await getJSON(`https://pokeapi.co/api/v2/pokemon-species/${id}`); const n = sp.names.find(x => x.language.name === 'en'); return n ? n.name : null; } catch (e) { return null; }
}
async function doLookup(forceSet) {
  const raw = $('#fCode').value.trim();
  $('#setCands').innerHTML = ''; $('#cardInfo').innerHTML = '';
  if (!raw) { toast('Bitte Kartencode eingeben'); return; }
  $('#lookBusy').classList.remove('hidden');
  try {
    const lang = curLang();
    let list = await getSets(lang);
    let p = parseCode(raw, list);
    if (WESTERN(lang) && p && p.set && !list.some(x => norm(x.id) === norm(p.set) || norm(x.abbr) === norm(p.set))) { await fillAbbr(lang, list); p = parseCode(raw, list); }
    if (!p || !p.num) throw new Error('Code nicht verstanden – Beispiel: M5 092/081');
    let setId = forceSet || null;
    if (!setId) {
      const exact = list.find(x => norm(x.id) === norm(p.set)) || list.find(x => x.abbr && norm(x.abbr) === norm(p.set));
      if (exact) setId = exact.id;
      else {
        const byDen = p.den ? list.filter(x => String(x.official) === String(parseInt(p.den, 10))) : [];
        if (byDen.length === 1) setId = byDen[0].id;
        else if (byDen.length > 1) { showCands(byDen); throw new Error('Mehrere Sets passen – bitte antippen.'); }
        else throw new Error(p.set ? `Set „${p.set.toUpperCase()}“ in ${$('#fLang').selectedOptions[0].text} nicht gefunden. Sprache richtig? Ganz neue Sets fehlen manchmal noch.` : 'Bitte Set-Kürzel mit angeben, z. B. M5 092/081.');
      }
    }
    const { set, card, via } = await loadCard(setId, p.num);
    const cm = card.pricing && card.pricing.cardmarket;
    const pick = (...k) => { for (const x of k) if (cm && typeof cm[x] === 'number' && cm[x] > 0) return cm[x]; return null; };
    F.card = {
      set: setId, setName: set.name || setId, setDate: set.releaseDate || '', serie: set.serie && set.serie.name || '', illus: card.illustrator || '',
      abbr: (list.find(x => x.id === setId) || {}).abbr || '', num: card.localId, den: set.cardCount && set.cardCount.official,
      name: card.name, nameEn: '', rarity: card.rarity && card.rarity !== 'None' ? card.rarity : '', via: via || '', img: card.image ? card.image + '/low.webp' : '',
      cmId: cm && (cm.idProduct || cm.productId) || null,
      low: pick('low', 'low-holo'), trend: pick('trend', 'avg30', 'avg7', 'trend-holo', 'avg30-holo')
    };
    renderCardInfo(); offerLow(); updateDeal();
    if (lang !== 'en') englishName(card).then(en => { if (en && F.card && F.card.name === card.name && en !== card.name) { F.card.nameEn = en; renderCardInfo(); } });
  } catch (e) {

}

let cmData = null, cmLoading = null;
function cmUrls() {
  const u = [], h = location.hostname;
  if (h.endsWith('.github.io')) {
    const user = h.split('.')[0], repo = location.pathname.split('/').filter(Boolean)[0] || h;
    u.push(`https://raw.githubusercontent.com/${user}/${repo}/main/cm-sealed.json?h=${Math.floor(Date.now() / 36e5)}`);
  }
  u.push('cm-sealed.json'); return u;
}
function cmStatusText() {
  $('#cmStatus').textContent = cmData ? `Stand ${fDate(cmData.date)} · ${cmData.p.length.toLocaleString('de-DE')} Produkte` : 'Liste nicht gefunden – ist die Datei preise.yml eingerichtet und einmal gelaufen?';
  $('#cmInfo').textContent = cmData ? '· Stand ' + fDate(cmData.date) : '';
}
function loadCM(force) {
  if (cmData && !force) return Promise.resolve(cmData);
  if (cmLoading) return cmLoading;
  cmLoading = (async () => {
    let got = null;
    for (const u of cmUrls()) { try { const j = await getJSON(u); if (j && Array.isArray(j.p)) { got = j; break; } } catch (e) {} }
    if (got) { cmData = got; idbSet('kv', 'cm', got); } else if (!cmData) cmData = await idbGet('kv', 'cm');
    cmStatusText(); cmLoading = null; return cmData;
  })();
  return cmLoading;
}
const norm2 = s => String(s).toLowerCase().replace(/[^a-z0-9äöüé]+/g, ' ').trim();
function cmSearch(q) {
  const toks = norm2(q).split(' ').filter(Boolean); if (!toks.length || !cmData) return [];
  const res = [];
  for (const p of cmData.p) { const nm = norm2(p[1]); if (toks.every(t => nm.includes(t))) res.push(p); if (res.length > 400) break; }
  const rank = c => /display/i.test(c) ? 0 : /booster/i.test(c) ? 1 : 2;
  return res.sort((a, b) => rank(a[2]) - rank(b[2]) || a[1].length - b[1].length).slice(0, 25);
}

  const q = norm($('#fSearch').value);
  let sY = 0, sE = 0, mk = 0, mkCost = 0;
  items.forEach(i => { sY += i.priceJPY || 0; sE += i.priceEUR || 0; if (i.marketEUR) { mk += i.marketEUR * (i.qty || 1); mkCost += i.priceEUR || 0; } });
  $('#sSpentY').textContent = fY(sY); $('#sSpentE').textContent = `≈ ${fE(sE)} · ${items.length} Einträge`;
  $('#sMarket').textContent = fE(mk);
  const d = mk - mkCost;
  $('#sDiff').innerHTML = mkCost ? `<span style="color:${d >= 0 ? 'var(--ok)' : 'var(--bad)'}">${d >= 0 ? '+' : ''}${fE(d)}</span> ggü. Einkauf` : 'noch keine Cardmarket-Preise';
  const list = items.filter(i => !q || norm([i.name, i.nameEn, i.place, i.lang, i.set, i.setName, i.num, i.code, i.note, i.type, i.cat].join(' ')).includes(q));
  $('#list').innerHTML = list.length ? list.map(i => {
    const pic = i.thumb || i.img;
    return `<button class="item" data-id="${i.id}">
      ${pic ? `<img src="${esc(pic)}" alt="" loading="lazy">` : `<div class="ph">${i.type === 'Sealed' ? '📦' : '🃏'}</div>`}
      <div class="body">
        <div class="t">${esc(i.name)}${(i.qty || 1) > 1 ? ` ×${i.qty}` : ''}</div>
        <div class="s">${esc(LANG_LBL[i.lang] || 'JP')} · ${esc(i.type)}${i.cond ? ' · ' + esc(i.cond) : ''}${i.grade ? ' · ' + esc(i.grade) : ''}${i.set ? ' · ' + esc(i.set) + ' ' + esc(i.num) : ''} · ${fDate(i.date)}</div>
        ${i.setName ? `<div class="s">${esc(i.setName)}${i.setDate ? ' · ' + esc(i.setDate.slice(0, 4)) : ''}</div>` : ''}
        <div class="p">${fY(i.priceJPY)} <span class="mut">(${fE(i.priceEUR)})</span>${dealTag(i)}${i.place ? ` <span class="mut">· ${esc(i.place)}</span>` : ''}</div>
      </div><div class="arr">›</div></button>`;
  }).join('') : `<p class="mut" style="text-align:center;margin-top:30px">${items.length ? 'Nichts gefunden.' : 'Noch keine Käufe erfasst.'}</p>`;
}

/* ---------- Export ---------- */
function rows() {
  return items.slice().sort((a, b) => a.date.localeCompare(b.date) || a.created - b.created).map(i => ({
    'Kaufdatum': i.date, 'Kaufort': i.place || '', 'Sprache': LANG_LBL[i.lang] || 'JP', 'Typ': i.type, 'Name': i.name, 'Name (EN)': i.nameEn || '', 'Kartencode': i.code || (i.set ? `${i.abbr && i.abbr !== '-' ? i.abbr : i.set} ${i.num}${i.den ? '/' + i.den : ''}` : ''),
    'Set-Name': i.setName || '', 'Set erschienen': i.setDate ? fDate(i.setDate) : '', 'Serie': i.serie || '', 'Kategorie': i.cat || '', 'Seltenheit': i.rarity || '', 'Zustand': i.cond || '', 'Grading': i.grade || '', 'Menge': i.qty || 1,
    'Preis vor Ort ¥': i.priceJPY, 'Preis vor Ort €': i.priceEUR, 'Kurs (1 € = ¥)': Math.round((i.rate || R()) * 100) / 100,
    'Marktpreis €/Stk. (beim Kauf)': i.marketEUR || '', 'Marktpreis ¥/Stk. (beim Kauf)': i.marketEUR ? Math.round(i.marketEUR * (i.rate || R())) : '',
    'Abweichung %': i.marketEUR ? Math.round(((i.priceEUR / (i.qty || 1)) / i.marketEUR - 1) * 1000) / 10 : '',
    'Cardmarket-Link': (i.cmId || i.name) ? cmHref(i.cmId, i.nameEn || i.name) : '', 'Notiz': i.note || ''
  }));
}
async function shareOrDownload(blob, filename) {
  const file = new File([blob], filename, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
async function exportXlsx() {
  if (!items.length) { toast('Noch nichts zu exportieren'); return; }
  try {
    toast('Erstelle Excel-Datei …');
    await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
    const data = rows().map(r => Object.assign({}, r, { 'Kaufdatum': new Date(r['Kaufdatum'] + 'T12:00:00') }));
    const ws = XLSX.utils.json_to_sheet(data, { cellDates: true, dateNF: 'dd.mm.yyyy' });
    ws['!cols'] = Object.keys(data[0]).map(k => ({ wch: Math.max(10, Math.min(40, k.length + 2, ...data.map(r => String(r[k] instanceof Date ? '00.00.0000' : r[k]).length + 2))) }));
    const range = XLSX.utils.decode_range(ws['!ref']);
    for (let r = 1; r <= range.e.r; r++) { const c = ws[XLSX.utils.encode_cell({ r, c: 0 })]; if (c) c.z = 'dd.mm.yyyy'; }
    ws['!autofilter'] = { ref: ws['!ref'] };
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Käufe');
    const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array', cellDates: true });
    await shareOrDownload(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `Japan-Haul_${today()}.xlsx`);
  } catch (e) { toast('Excel-Export fehlgeschlagen – CSV probieren'); }
}
function exportCsv() {
  if (!items.length) { toast('Noch nichts zu exportieren'); return; }
  const rs = rows(), keys = Object.keys(rs[0]);
  const cell = v => { if (typeof v === 'number') return String(v).replace('.', ','); const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = '﻿' + [keys.join(';'), ...rs.map(r => keys.map(k => k === 'Kaufdatum' ? fDate(r[k]) : cell(r[k])).join(';'))].join('\r\n');
  shareOrDownload(new Blob([csv], { type: 'text/csv;charset=utf-8' }), `Japan-Haul_${today()}.csv`);
}
async function backup() {
  toast('Erstelle Backup …');
  const photos = {};
  for (const i of items) if (i.hasPhoto) { const p = await idbGet('photos', i.id); if (p) photos[i.id] = p; }
  shareOrDownload(new Blob([JSON.stringify({ v: 2, items, photos, settings })], { type: 'application/json' }), `Japan-Haul-Backup_${today()}.json`);
}
async function restore(file) {
  try {
    const d = JSON.parse(await file.text()); if (!Array.isArray(d.items)) throw 0;
    const ids = new Set(items.map(i => i.id)); let n = 0;
    for (const i of d.items) if (!ids.has(i.id)) { items.push(i); n++; if (d.photos && d.photos[i.id]) await idbSet('photos', i.id, d.photos[i.id]); }
    items.sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);
    saveItems(); renderList(); toast(`${n} Einträge übernommen`);
  } catch (e) { toast('Datei ist kein gültiges Backup'); }
}

/* ---------- Tabs ---------- */
function showTab(id) {
  ['tabAdd', 'tabList', 'tabSet'].forEach(t => $('#' + t).classList.toggle('hidden', t !== id));
  $$('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
  if (id === 'tabList') renderList();
  window.scrollTo(0, 0);
}

/* ---------- Events ---------- */
$$('nav button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
$('#segType').onclick = e => { const b = e.target.closest('button'); if (b) setType(b.dataset.v); };
$('#segCur').onclick = e => { const b = e.target.closest('button'); if (b) setCur(b.dataset.v); };
$('#btnPhoto').onclick = $('#btnPhotoAgain').onclick = () => { $('#inPhoto').value = ''; $('#inPhoto').click(); };
$('#inPhoto').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const img = await fileToImg(f); F.photo = scaleImg(img, 1400, .78); F.thumb = scaleImg(img, 220, .6); F.photoChanged = true; showPhoto(F.photo); }
  catch (err) { toast('Foto konnte nicht geladen werden'); }
};
$('#btnLookup').onclick = () => doLookup();
$('#fCode').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#fCode').blur(); doLookup(); } });
$('#setCands').onclick = e => { const b = e.target.closest('[data-id]'); if (b) doLookup(b.dataset.id); };
let suggT;
$('#fSealedQ').addEventListener('input', () => { F.sealed = null; renderSealedInfo(); offerLow(); clearTimeout(suggT); suggT = setTimeout(renderSugg, 200); });
$('#fSealedQ').addEventListener('focus', () => { if ($('#fSealedQ').value.trim() && !F.sealed) renderSugg(); });
$('#sugg').onclick = e => { const b = e.target.closest('[data-cm]'); if (b) selectSealed(+b.dataset.cm); };
$('#btnTakeLow').onclick = () => { const s = F.type === 'Sealed' ? F.sealed : F.card; if (s && s.low) { $('#fMarket').value = fNumIn(s.low); updateDeal(); } };
['#fPrice', '#fMarket', '#fQty'].forEach(s => $(s).addEventListener('input', updateDeal));
$('#btnSave').onclick = save;
$('#btnDelete').onclick = del;
$('#btnNew').onclick = () => { newForm(); window.scrollTo(0, 0); };
$('#list').onclick = e => { const b = e.target.closest('.item'); if (b) openItem(b.dataset.id); };
$('#fSearch').oninput = renderList;
$('#btnExport').onclick = $('#btnExport2').onclick = exportXlsx;
$('#btnCsv').onclick = exportCsv; $('#btnBackup').onclick = backup;
$('#btnRestore').onclick = () => $('#inRestore').click();
$('#inRestore').onchange = e => { const f = e.target.files[0]; if (f) restore(f); };
$('#btnRateSave').onclick = () => { settings.rateOverride = num($('#fRateOv').value); LS.set('jh_settings', settings); renderRate(); toast('Kurs übernommen'); };
$('#btnCmReload').onclick = async () => { $('#cmStatus').textContent = 'Lade …'; await loadCM(true); toast(cmData ? 'Liste aktuell ✓' : 'Liste nicht gefunden'); };

function fillPlaces() {
  const ps = [...new Set(items.map(i => i.place).filter(Boolean))];
  $('#placeList').innerHTML = ps.map(p => `<option value="${esc(p)}">`).join('');
}
$('#fLang').onchange = () => { F.card = null; renderCardInfo(); $('#setCands').innerHTML = ''; offerLow(); getSets().catch(() => {}); if ($('#fCode').value.trim()) doLookup(); };

/* ---------- Start ---------- */
newForm(); renderRate(); renderList(); loadRate();
getSets().catch(() => {});
idbGet('kv', 'cm').then(d => { if (d && !cmData) cmData = d; cmStatusText(); loadCM(true); });
</script>
